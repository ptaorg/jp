name: Patch chapter 14

on:
  push:
    branches: [main]
    paths:
      - 'docs/chapter14-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply chapter 14 patch
        run: python3 apply_chapter14_patch.py
      - name: Commit chapter 14 patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/guideline.md index.html
          git commit -m "Expand chapter 14 source verification" || exit 0
          git push
