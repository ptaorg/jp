<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560"><rect width="1280" height="560" fill="#ffffff"/><rect x="40" y="40" width="1200" height="480" rx="18" fill="#f6f8fb" stroke="#cfd8e6" stroke-width="2"/><text x="80" y="105" font-size="36" font-weight="700" fill="#0b3a67">School and PTA separation actions</text><text x="80" y="170" font-size="24" fill="#172033">1. Survey all schools</text><text x="80" y="225" font-size="24" fill="#172033">2. Confirm membership records</text><text x="80" y="280" font-size="24" fill="#172033">3. Separate PTA fee collection</text><text x="80" y="335" font-size="24" fill="#172033">4. Separate school-held personal information</text><text x="80" y="390" font-size="24" fill="#172033">5. Review staff work and facility use</text><text x="80" y="465" font-size="22" font-weight="700" fill="#0b3a67">Return PTA procedures to PTA while removing dependence on school resources.</text></svg>
